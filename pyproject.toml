[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "compact-bench"
version = "0.1.0"
description = "COMPACT-Bench: one budget axis for memory compaction in LLMs and agents"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
  {name = "Anonymous authors"},
]
dependencies = [
  "torch",
  "transformers",
  "kvpress>=0.5",
  "datasets",
  "matplotlib",
]

[project.optional-dependencies]
# 4-bit NF4 weights, which is what lets 7B-class models run the sweep on an 8 GB card.
quant = ["bitsandbytes>=0.43"]
# LLMLingua-2 prompt compression for the mechanisms task.
mech = ["llmlingua>=0.2"]

[project.scripts]
compactbench = "compactbench.cli:main"

[tool.setuptools.packages.find]
include = ["compactbench*"]
