[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "compact-bench"
version = "0.1.0"
description = "COMPACT-Bench: one budget axis for memory compaction in LLMs and agents"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
  {name = "Ashwin Gerard Colaco"},
  {name = "Nada Lahjouji"},
]
dependencies = [
  "torch",
  "transformers",
  "kvpress>=0.5",
  "datasets",
  "matplotlib",
]

[project.scripts]
compactbench = "compactbench.cli:main"

[tool.setuptools.packages.find]
include = ["compactbench*"]
